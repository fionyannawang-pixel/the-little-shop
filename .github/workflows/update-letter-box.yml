name: Update Letter Box
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/letter-box-update.txt"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Letter Box UI
        shell: python
        run: |
          import base64
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          start=s.index("window.letter=()=>")
          end=s.index("window.flower=()=>",start)
          replacement=base64.b64decode("""""").decode()
          p.write_text(s[:start]+replacement+s[end:])
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Complete Letter Box flow and email hook" || exit 0
          git push
