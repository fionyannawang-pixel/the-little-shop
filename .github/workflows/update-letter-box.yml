name: Keep Letter Box deployment stable
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/letter-box-update.txt"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current site
        run: |
          grep -q "The email knock did not work" index.html && exit 1 || true
          grep -q "open my letters" index.html
