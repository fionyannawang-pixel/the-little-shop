<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大小够不着 — Beyond Small, Beyond Big</title><style>body{margin:0;font-family:Georgia,'Noto Serif SC',serif;background:#fbf4e5;color:#5d4638}button,input{font:inherit}button{cursor:pointer}.screen{min-height:100vh;display:none}.screen.active{display:flex}.entrance{align-items:center;justify-content:center}.shop-scene{width:min(820px,88vw);height:520px;position:relative;cursor:pointer}.shop{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);width:440px;height:300px;background:#f7e5c6;border:5px solid #6d5140;border-radius:18px;box-shadow:0 12px 0 #dcc49c}.roof{position:absolute;left:-38px;top:-125px;width:510px;height:170px;background:#ead4ae;border:5px solid #6d5140;border-radius:55% 55% 12px 12px}.sign{position:absolute;top:-65px;left:95px;width:245px;padding:14px;background:#fff7e8;border:3px solid #6d5140;border-radius:12px;text-align:center;font-size:25px;z-index:2}.door{position:absolute;bottom:0;left:174px;width:92px;height:170px;background:#8aa5a0;border:5px solid #6d5140;border-bottom:0;border-radius:48px 48px 0 0}.window{position:absolute;bottom:90px;width:80px;height:80px;background:#dbe9e5;border:5px solid #6d5140;border-radius:12px}.window.l{left:35px}.window.r{right:35px}.window:after,.window:before{content:'';position:absolute;background:#6d5140}.window:after{width:4px;height:100%;left:50%}.window:before{height:4px;width:100%;top:50%}.hint{position:absolute;bottom:5px;width:100%;text-align:center;font-size:20px;opacity:.75}.auth{align-items:center;justify-content:center}.authbox{width:min(420px,88vw);background:#fff8ea;border:3px solid #6d5140;border-radius:20px;padding:28px;box-shadow:0 12px 0 #dcc49c}.authbox h1{text-align:center;margin:0 0 8px}.authbox p{text-align:center}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{flex:1;background:#f0dfbf;border:2px solid #8c6a52;border-radius:10px;padding:9px}.tabs button.active{background:#dbe9e5}.field{width:100%;box-sizing:border-box;padding:11px;margin:7px 0;border:2px solid #c7ad8d;border-radius:10px;background:#fffdf7}.primary{width:100%;padding:12px;border:2px solid #6d5140;border-radius:10px;background:#f0dfbf;color:#5d4638}.back{border:0;background:transparent;margin-top:12px;color:#6d5140}.msg{text-align:center;min-height:22px;font-size:14px}.app{flex-direction:column}.nav{height:66px;background:#fff8ea;border-bottom:2px solid #d8c3a2;display:flex;align-items:center;padding:0 24px;gap:10px}.nav button{background:transparent;border:0;padding:10px 13px;border-radius:10px;color:#5d4638}.nav button:hover{background:#f0dfbf}.brand{font-size:21px;margin-right:auto}.content{padding:32px;max-width:1000px;width:100%;box-sizing:border-box;margin:auto}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{background:#fff8ea;border:2px solid #d4b993;border-radius:16px;padding:20px;min-height:145px}.card h3{margin-top:0}.card button{background:#f0dfbf;border:2px solid #8c6a52;border-radius:9px;padding:8px}.modal{position:fixed;inset:0;background:#0004;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(560px,92vw);max-height:85vh;overflow:auto;background:#fff8ea;border:3px solid #6d5140;border-radius:18px;padding:24px}.modalbox textarea{width:100%;min-height:170px;box-sizing:border-box;padding:12px;border:2px solid #c7ad8d;border-radius:10px;background:#fffdf7}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.row button{padding:9px 13px;border:2px solid #8c6a52;border-radius:9px;background:#f0dfbf}</style></head><body><section id="entrance" class="screen entrance active"><div class="shop-scene" id="enterShop"><div class="shop"><div class="roof"></div><div class="sign">大小够不着</div><div class="window l"></div><div class="window r"></div><div class="door"></div></div><div class="hint">hover over the little shop · click to enter</div></div></section><section id="auth" class="screen auth"><div class="authbox"><h1>Welcome to the Little Shop</h1><p>进门之前，先告诉我你是谁。</p><div class="tabs"><button id="loginTab" class="active">Log in</button><button id="signupTab">Sign up</button></div><div id="nameWrap" style="display:none"><input id="name" class="field" placeholder="Your name"></div><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password"><button id="authSubmit" class="primary">Log in</button><div id="authMsg" class="msg"></div><button id="backEntrance" class="back">← back outside</button></div></section><section id="app" class="screen app"><nav class="nav"><div class="brand">大小够不着</div><button data-page="shop">Shop</button><button data-page="garden">Garden</button><button data-page="things">My Things</button><button id="account">Account</button></nav><main id="content" class="content"></main></section><div id="modal" class="modal"><div class="modalbox"><div id="modalContent"></div><div class="row"><button id="closeModal">close</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://ewyufxrej.supabase.co";const SUPABASE_KEY="sb_publishable_y2DUFy_gBTfof8oq5iKJ7w_RKZ1AH1R";const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let mode="login",user=null;const $=id=>document.getElementById(id);function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}function msg(t){$("authMsg").textContent=t}async function refreshSession(){const{data}=await supabase.auth.getSession();user=data.session?.user||null;if(user){show("app");render("shop")}}function authUI(){const signup=mode==="signup";$("loginTab").classList.toggle("active",!signup);$("signupTab").classList.toggle("active",signup);$("nameWrap").style.display=signup?"block":"none";$("authSubmit").textContent=signup?"Create account":"Log in";msg("")}$("enterShop").onclick=async()=>{const{data}=await supabase.auth.getSession();if(data.session){user=data.session.user;show("app");render("shop")}else{show("auth");authUI()}};$("backEntrance").onclick=()=>show("entrance");$("loginTab").onclick=()=>{mode="login";authUI()};$("signupTab").onclick=()=>{mode="signup";authUI()};$("authSubmit").onclick=async()=>{const email=$("email").value.trim(),password=$("password").value,name=$("name").value.trim();if(!email||!password||(mode==="signup"&&!name)){msg("Please fill in everything.");return}$("authSubmit").disabled=true;msg("One moment…");try{if(mode==="signup"){const r=await supabase.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;if(!r.data.session){msg("Account created! Check your email to confirm, then come back and log in.")}else{user=r.data.user;show("app");render("shop")}}else{const r=await supabase.auth.signInWithPassword({email,password});if(r.error)throw r.error;user=r.data.user;show("app");render("shop")}}catch(e){msg(e.message||"Something went wrong.")}finally{$("authSubmit").disabled=false}};$("account").onclick=async()=>{if(confirm("Log out of the Little Shop?")){await supabase.auth.signOut();user=null;show("entrance")}};document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>render(b.dataset.page));$("closeModal").onclick=()=>$("modal").classList.remove("show");function render(page){if(page==="shop"){$("content").innerHTML='<h1>The Shop</h1><p>小店今天开门了。先把最重要的入口做好。</p><div class="cards"><article class="card"><h3>✉️ Letter Box</h3><p>Write a letter that can wait for the right moment.</p><button onclick="letter()">open</button></article><article class="card"><h3>🌱 Grow a Flower</h3><p>Give a flower one meaningful thing today.</p><button onclick="flower()">open</button></article><article class="card"><h3>✨ One Good Thing About Me</h3><p>Keep one honest good thing about yourself.</p><button onclick="goodThing()">open</button></article><article class="card"><h3>🗺️ Map</h3><p>Mark somewhere real—or somewhere you invented.</p><button onclick="mapThing()">open</button></article><article class="card"><h3>🪄 A Strange Little Wish</h3><p>Leave a tiny strange blessing in the world.</p><button onclick="wish()">open</button></article></div>"}else if(page==="garden"){$("content").innerHTML="<h1>Garden</h1><p>Your flowers will live here. Nothing disappears just because you missed a day.</p>"}else{$("content").innerHTML="<h1>My Things</h1><p>Your letters, flowers, wishes and little discoveries will collect here.</p>"}}function openModal(html){$("modalContent").innerHTML=html;$("modal").classList.add("show")}function letter(){openModal('<h2>✉️ Letter Box</h2><p>Write a letter. The real letter will live inside the Shop; email is only the knock on the door.</p><textarea id="letterBody" placeholder="Dear future me…"></textarea><div class="row"><button onclick="saveLetter()">put it in the box</button></div>')}function saveLetter(){const body=$("letterBody").value.trim();if(!body)return;localStorage.setItem("letter-"+user.id,body);openModal('<h2>✉️ It is in the box.</h2><p>Your letter has been saved for your account. The next backend step will connect the real email notification.</p>')}function flower(){openModal('<h2>🌱 Grow a Flower</h2><p>One new flower a day. Give it one meaningful thing.</p><textarea placeholder="A memory, hope, little achievement…"></textarea>')}function goodThing(){openModal('<h2>✨ One Good Thing About Me</h2><p>Write one good quality you genuinely know is yours.</p><textarea placeholder="I know that I…"></textarea>')}function mapThing(){openModal('<h2>🗺️ Map</h2><p>Your map can hold real places and imaginary places.</p><textarea placeholder="A place I want to go / a place I invented…"></textarea>')}function wish(){openModal('<h2>🪄 A Strange Little Wish</h2><p>Write a tiny strange blessing.</p><textarea placeholder="I hope that…"></textarea>')}supabase.auth.onAuthStateChange((_event,session)=>{user=session?.user||null});refreshSession();</script></body></html>
